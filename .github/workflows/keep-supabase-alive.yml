name: Keep Supabase Alive

on:
  schedule:
    # Runs every 2 days at 04:00 UTC (12:00 PM SGT)
    - cron: '0 4 */2 * *'
  # Allows manually triggering the workflow from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Database to Prevent Inactivity Pause
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wwzqpatllqneldjqrcku.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_j-GTdoAgYQYQXHbnGHXolw_sIBYymq_' }}
        run: |
          echo "Pinging Supabase database to reset 7-day inactivity pause..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/cards?select=count" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP Status: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Successfully pinged database. Inactivity timer reset!"
          else
            echo "⚠️ Request failed with status $HTTP_STATUS"
            exit 1
          fi
